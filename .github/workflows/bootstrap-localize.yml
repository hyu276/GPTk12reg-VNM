name: Bootstrap Vietnamese localization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-localize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy source repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone --depth 1 --branch main https://github.com/semon0148/chatgpt-register-k12.git /tmp/source
          git checkout -b feat/vietnamese-localization
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/source/. .
          rm -rf ./.git
          mkdir -p _localization

      - name: Inventory all Chinese text
        shell: python
        run: |
          import pathlib
          import re

          root = pathlib.Path('.')
          han = re.compile(r'[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]')
          skip_dirs = {'.git', '__pycache__', '.venv', 'venv', 'node_modules'}
          binary_exts = {'.png', '.jpg', '.jpeg', '.gif', '.ico', '.webp', '.woff', '.woff2', '.ttf', '.zip', '.gz', '.pdf'}
          hits = []

          for path in sorted(root.rglob('*')):
              if not path.is_file():
                  continue
              if any(part in skip_dirs for part in path.parts):
                  continue
              if path.suffix.lower() in binary_exts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              for lineno, line in enumerate(text.splitlines(), 1):
                  if han.search(line):
                      hits.append(f'{path.as_posix()}:{lineno}: {line}')

          report = [
              '# Chinese text inventory',
              '',
              f'Total lines containing Han characters: {len(hits)}',
              '',
              *hits,
              '',
          ]
          pathlib.Path('_localization/chinese_inventory.txt').write_text('\n'.join(report), encoding='utf-8')
          print(f'Found {len(hits)} lines containing Han characters')

      - name: Commit imported source and inventory
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "chore: Import upstream source for localization"
          git push -u origin feat/vietnamese-localization
